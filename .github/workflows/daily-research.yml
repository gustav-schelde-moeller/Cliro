name: Daily company research

# Railway doesn't have a built-in cron scheduler on this plan (and this
# also predates the move off Vercel, where the same limitation applied to
# Vercel's own Cron Jobs on the Hobby plan), so this workflow triggers the
# endpoint on a schedule instead — GitHub Actions isn't subject to either
# platform's limits.
on:
  schedule:
    - cron: "0 6,8,10,12 * * 1-5"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-research endpoint
        run: |
          curl -s -w "\nHTTP status: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://cliro-app-production.up.railway.app/api/cron/daily-research
