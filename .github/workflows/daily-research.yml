name: Daily company research

# Vercel's own Cron Jobs feature is limited on the Hobby plan (rejected a
# 4x/day schedule), so this workflow triggers the same endpoint instead —
# GitHub Actions' scheduler isn't subject to that limit.
on:
  schedule:
    - cron: "0 6,8,10,12 * * 1-5"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-research endpoint
        run: |
          curl -s -w "\nHTTP status: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://cliro-tau.vercel.app/api/cron/daily-research
